<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>777X Gaming Admin Panel</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#09090d;
  color:#fff;
  font-family:Arial,sans-serif
}
header{
  padding:20px;
  text-align:center;
  background:#111;
  border-bottom:2px solid #ff1738
}
header h1{
  color:#ff1738;
  margin:0;
  text-shadow:0 0 10px #ff1738
}
main{max-width:1000px;margin:auto;padding:15px}
section{
  background:#15151d;
  padding:17px;
  border:1px solid #333;
  border-radius:10px;
  margin:15px 0
}
h2{color:#ff1738}
input,select,textarea{
  width:100%;
  padding:12px;
  margin:8px 0;
  background:#09090d;
  color:white;
  border:1px solid #444;
  border-radius:6px
}
button{
  background:#ff1738;
  color:white;
  border:0;
  padding:11px 14px;
  margin:4px;
  border-radius:6px;
  cursor:pointer;
  font-weight:bold
}
button:disabled{opacity:.5}
.card{
  padding:13px;
  margin:10px 0;
  background:#0b0b12;
  border:1px solid #444;
  border-radius:8px;
  overflow-wrap:anywhere
}
.hidden{display:none!important}
#message{
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  padding:8px
}
.small{color:#bbb;font-size:13px}
</style>
</head>

<body>
<header>
  <h1>777X GAMING</h1>
  <p>ADMIN CONTROL PANEL</p>
</header>

<main>
  <p id="message"></p>

  <section id="loginBox">
    <h2>🔐 Admin Login</h2>
    <input id="email" type="email" placeholder="Admin Email">
    <input id="password" type="password" placeholder="Password">
    <button id="loginButton" onclick="login()">Login</button>
  </section>

  <div id="panel" class="hidden">

    <section>
      <h2>👤 Admin Account</h2>
      <p id="adminEmail"></p>
      <button onclick="logout()">Logout</button>
    </section>

    <section>
      <h2>🏆 Create Tournament</h2>

      <input id="tTitle" placeholder="Tournament Name">

      <select id="tMode">
        <option value="Solo">Solo</option>
        <option value="Duo">Duo</option>
        <option value="Squad">Squad</option>
      </select>

      <input id="tFee" type="number" min="0" placeholder="Entry Fee (৳)">
      <input id="tPrize" type="number" min="0" placeholder="Prize Pool (৳)">
      <input id="tDate" type="datetime-local">
      <textarea id="tDescription" placeholder="Tournament Details"></textarea>

      <button onclick="createTournament()">Create Tournament</button>
    </section>

    <section>
      <h2>📋 Tournament Management</h2>
      <button onclick="loadTournaments()">Refresh Tournaments</button>
      <div id="tournaments">Loading...</div>
    </section>

    <section>
      <h2>💎 Add Diamond Package</h2>

      <input id="pTitle" placeholder="Package Name">

      <select id="pCategory">
        <option value="UID Top-Up">UID Top-Up</option>
        <option value="Weekly">Weekly Membership</option>
        <option value="Monthly">Monthly Membership</option>
      </select>

      <input id="pDiamonds" type="number" min="1"
             placeholder="Diamond Quantity (Membership হলে খালি রাখো)">

      <input id="pPrice" type="number" min="0" placeholder="Price (৳)">
      <textarea id="pDescription" placeholder="Package Details"></textarea>

      <button onclick="createPackage()">Add Package</button>
    </section>

    <section>
      <h2>💎 Package Management</h2>
      <button onclick="loadPackages()">Refresh Packages</button>
      <div id="packages">Loading...</div>
    </section>

    <section>
      <h2>📦 Player Orders</h2>
      <button onclick="loadOrders()">Refresh Orders</button>
      <div id="orders">Loading...</div>
    </section>

  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL =
  "https://srtrzhsgclaakuknests.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_j4hCa56Lmq4QboUuFq3xKA_LFFM3K1w";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const $ = id => document.getElementById(id);

function say(text){
  $("message").textContent = text;
}

function safe(text){
  return String(text ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  }[c]));
}

/* ADMIN LOGIN CHECK */

async function checkAdmin(){
  const {data:{user},error:userError} = await db.auth.getUser();

  if(userError){
    say("Login check error: " + userError.message);
    return;
  }

  if(!user){
    $("loginBox").classList.remove("hidden");
    $("panel").classList.add("hidden");
    return;
  }

  const {data,error} = await db
    .from("admins")
    .select("user_id")
    .eq("user_id",user.id)
    .maybeSingle();

  if(error){
    $("panel").classList.add("hidden");
    say("Admin check error: " + error.message);
    return;
  }

  if(!data){
    $("panel").classList.add("hidden");
    $("loginBox").classList.remove("hidden");
    say("এই Email Admin হিসেবে অনুমোদিত নয়।");
    return;
  }

  $("loginBox").classList.add("hidden");
  $("panel").classList.remove("hidden");
  $("adminEmail").textContent = "Logged in: " + user.email;

  say("Admin Login Successful.");

  await Promise.all([
    loadTournaments(),
    loadPackages(),
    loadOrders()
  ]);
}

async function login(){
  const email = $("email").value.trim();
  const password = $("password").value;

  if(!email || !password){
    say("Email ও Password দাও।");
    return;
  }

  $("loginButton").disabled = true;

  try{
    const {error} = await db.auth.signInWithPassword({
      email,
      password
    });

    if(error){
      say("Login Error: " + error.message);
      return;
    }

    await checkAdmin();
  }finally{
    $("loginButton").disabled = false;
  }
}

async function logout(){
  const {error} = await db.auth.signOut();

  if(error){
    say(error.message);
    return;
  }

  $("panel").classList.add("hidden");
  $("loginBox").classList.remove("hidden");
  say("Logout Successful.");
}

/* CREATE TOURNAMENT */

async function createTournament(){
  const title = $("tTitle").value.trim();
  const fee = $("tFee").value;
  const prize = $("tPrize").value;

  if(!title || fee === "" || prize === ""){
    say("Tournament Name, Entry Fee ও Prize Pool পূরণ করো।");
    return;
  }

  if(!Number.isFinite(Number(fee)) ||
     !Number.isFinite(Number(prize)) ||
     Number(fee) < 0 ||
     Number(prize) < 0){
    say("Entry Fee ও Prize Pool সঠিকভাবে লেখো।");
    return;
  }

  const date = $("tDate").value;

  const payload = {
    title: title,
    game: "Free Fire",
    mode: $("tMode").value,
    entry_fee: Number(fee),
    prize_pool: Number(prize),
    tournament_date: date ? new Date(date).toISOString() : null,
    description: $("tDescription").value.trim(),
    status: "Open"
  };

  const {error} = await db
    .from("tournaments")
    .insert(payload);

  if(error){
    say("Tournament Error: " + error.message);
    return;
  }

  say("Tournament তৈরি হয়েছে!");

  $("tTitle").value = "";
  $("tFee").value = "";
  $("tPrize").value = "";
  $("tDate").value = "";
  $("tDescription").value = "";

  await loadTournaments();
}

/* TOURNAMENT LIST */

async function loadTournaments(){
  const box = $("tournaments");
  box.textContent = "Loading...";

  const {data,error} = await db
    .from("tournaments")
    .select("*")
    .order("created_at",{ascending:false});

  if(error){
    box.textContent = "Error: " + error.message;
    return;
  }

  box.innerHTML = "";

  if(!data || !data.length){
    box.textContent = "এখনো কোনো Tournament নেই।";
    return;
  }

  data.forEach(t=>{
    const card = document.createElement("div");
    card.className = "card";

    card.innerHTML = `
      <h3>${safe(t.title)}</h3>
      <p>Game: ${safe(t.game)}</p>
      <p>Mode: ${safe(t.mode)}</p>
      <p>Entry Fee: ৳${safe(t.entry_fee)}</p>
      <p>Prize Pool: ৳${safe(t.prize_pool)}</p>
      <p>Status: ${safe(t.status)}</p>

      <select id="ts${Number(t.id)}">
        <option value="Open">Open</option>
        <option value="Full">Full</option>
        <option value="Started">Started</option>
        <option value="Completed">Completed</option>
        <option value="Cancelled">Cancelled</option>
      </select>

      <button onclick="updateTournament(${Number(t.id)})">
        Update Status
      </button>

      <button onclick="deleteTournament(${Number(t.id)})">
        Delete Tournament
      </button>
    `;

    box.appendChild(card);
    $("ts"+t.id).value = t.status;
  });
}

async function updateTournament(id){
  const status = $("ts"+id).value;

  const {error} = await db
    .from("tournaments")
    .update({status})
    .eq("id",id);

  if(error){
    say("Update Error: " + error.message);
    return;
  }

  say("Tournament Status Updated.");
  await loadTournaments();
}

async function deleteTournament(id){
  if(!confirm("এই Tournament মুছে ফেলতে চাও?")) return;

  const {error} = await db
    .from("tournaments")
    .delete()
    .eq("id",id);

  if(error){
    say("Delete Error: " + error.message);
    return;
  }

  say("Tournament মুছে ফেলা হয়েছে।");
  await loadTournaments();
}

/* CREATE DIAMOND PACKAGE */

async function createPackage(){
  const title = $("pTitle").value.trim();
  const price = $("pPrice").value;
  const diamonds = $("pDiamonds").value;

  if(!title || price === ""){
    say("Package Name ও Price পূরণ করো।");
    return;
  }

  if(!Number.isFinite(Number(price)) || Number(price) < 0){
    say("সঠিক Price দাও।");
    return;
  }

  if(diamonds &&
     (!Number.isInteger(Number(diamonds)) || Number(diamonds) <= 0)){
    say("Diamond Quantity সঠিকভাবে লেখো।");
    return;
  }

  const payload = {
    title,
    category: $("pCategory").value,
    diamonds: diamonds ? Number(diamonds) : null,
    price: Number(price),
    description: $("pDescription").value.trim(),
    active: true
  };

  const {error} = await db
    .from("diamond_packages")
    .insert(payload);

  if(error){
    say("Package Error: " + error.message);
    return;
  }

  say("Diamond Package যোগ হয়েছে!");

  $("pTitle").value = "";
  $("pPrice").value = "";
  $("pDiamonds").value = "";
  $("pDescription").value = "";

  await loadPackages();
}

/* PACKAGE MANAGEMENT */

async function loadPackages(){
  const box = $("packages");
  box.textContent = "Loading...";

  const {data,error} = await db
    .from("diamond_packages")
    .select("*")
    .order("created_at",{ascending:false});

  if(error){
    box.textContent = "Error: " + error.message;
    return;
  }

  box.innerHTML = "";

  if(!data || !data.length){
    box.textContent = "এখনো কোনো Package নেই।";
    return;
  }

  data.forEach(p=>{
    const card = document.createElement("div");
    card.className = "card";

    card.innerHTML = `
      <h3>${safe(p.title)}</h3>
      <p>Category: ${safe(p.category)}</p>
      <p>Diamonds: ${safe(p.diamonds ?? "Membership")}</p>
      <p>Price: ৳${safe(p.price)}</p>
      <p>Status: ${p.active ? "Active" : "Inactive"}</p>

      <button onclick="editPackage(${Number(p.id)})">
        Change Price
      </button>

      <button onclick="togglePackage(${Number(p.id)},${Boolean(p.active)})">
        ${p.active ? "Deactivate" : "Activate"}
      </button>

      <button onclick="deletePackage(${Number(p.id)})">
        Delete Package
      </button>
    `;

    box.appendChild(card);
  });
}

async function editPackage(id){
  const {data,error:readError} = await db
    .from("diamond_packages")
    .select("price")
    .eq("id",id)
    .single();

  if(readError){
    say(readError.message);
    return;
  }

  const value = prompt("নতুন Package Price (৳):",data.price);

  if(value === null) return;

  if(value.trim() === "" ||
     !Number.isFinite(Number(value)) ||
     Number(value) < 0){
    say("সঠিক Price দাও।");
    return;
  }

  const {error} = await db
    .from("diamond_packages")
    .update({price:Number(value)})
    .eq("id",id);

  if(error){
    say("Price Update Error: " + error.message);
    return;
  }

  say("Package Price পরিবর্তন হয়েছে।");
  await loadPackages();
}

async function togglePackage(id,active){
  const {error} = await db
    .from("diamond_packages")
    .update({active:!active})
    .eq("id",id);

  if(error){
    say(error.message);
    return;
  }

  say("Package Status Updated.");
  await loadPackages();
}

async function deletePackage(id){
  if(!confirm("এই Package মুছে ফেলতে চাও?")) return;

  const {error} = await db
    .from("diamond_packages")
    .delete()
    .eq("id",id);

  if(error){
    say("Delete Error: " + error.message);
    return;
  }

  say("Package মুছে ফেলা হয়েছে।");
  await loadPackages();
}

/* PLAYER ORDERS */

async function loadOrders(){
  const box = $("orders");
  box.textContent = "Loading...";

  const {data,error} = await db
    .from("orders")
    .select("*")
    .order("created_at",{ascending:false});

  if(error){
    box.textContent = "Orders Error: " + error.message;
    return;
  }

  box.innerHTML = "";

  if(!data || !data.length){
    box.textContent = "এখনো কোনো Order নেই।";
    return;
  }

  data.forEach(o=>{
    const card = document.createElement("div");
    card.className = "card";

    card.innerHTML = `
      <h3>Order #${safe(o.id)} — ৳${safe(o.amount)}</h3>
      <p>User ID: ${safe(o.user_id)}</p>
      <p>Free Fire UID: ${safe(o.player_uid)}</p>
      <p>Payment Method: ${safe(o.payment_method)}</p>
      <p>Transaction ID: ${safe(o.transaction_id)}</p>
      <p>Current Status: ${safe(o.status)}</p>

      <select id="os${Number(o.id)}">
        <option value="Pending">Pending</option>
        <option value="Verified">Verified</option>
        <option value="Processing">Processing</option>
        <option value="Completed">Completed</option>
        <option value="Rejected">Rejected</option>
      </select>

      <button onclick="updateOrder(${Number(o.id)})">
        Update Order Status
      </button>
    `;

    box.appendChild(card);
    $("os"+o.id).value = o.status;
  });
}

async function updateOrder(id){
  const status = $("os"+id).value;

  const {error} = await db
    .from("orders")
    .update({status})
    .eq("id",id);

  if(error){
    say("Order Update Error: " + error.message);
    return;
  }

  say("Order Status Updated.");
  await loadOrders();
}

db.auth.onAuthStateChange(()=>{
  setTimeout(checkAdmin,0);
});

checkAdmin();
</script>
</body>
</html>
